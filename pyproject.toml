[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dreamscale-i2rt"
version = "1.3.6.post1"
description = "Dreamscale's maintained build of the I2RT YAM arm and Flow Base Python driver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The core is what YAM arm control needs: the CAN motor drivers, the robot
# models and MuJoCo kinematics/gravity compensation. Everything else is an extra.
dependencies = [
    # crcmod-plus is a maintained fork that installs into the `crcmod` namespace, so code still does `import crcmod`.
    "crcmod-plus>=2.3.1",
    "dm-env>=1.6",
    # i2rt.robots.motor_chain_robot imports the MCAP recorder (i2rt.utils.recording).
    "mcap-ros2-support>=0.5.5",
    "mink>=0.0.13",
    "mujoco>=3.3.5",
    "numpy>=1.26,<3",
    "packaging",
    "pydantic>=2.0",
    "python-can>=4.5,<5",
    "pyyaml>=6.0.0",
    "qpsolvers[quadprog]>=4.7.1",
    "tyro>=1.0.0",
]

[project.optional-dependencies]
# Flow Base controller (i2rt.flow_base).
flow-base = [
    "portal>=3.7.3",
    "pygame>=2.6.1",
    "ruckig>=0.15.3",
    "threadpoolctl>=3.6.0",
]
# Gamepad teleoperation (i2rt.utils.gamepad_utils).
gamepad = ["pygame>=2.6.1"]
# Browser and recording visualisation (i2rt.utils.viser_control_interface, scripts).
viz = [
    "rerun-sdk>=0.32.2",
    "viser>=0.2.0",
]
# Linear-rail brake and limit switches (i2rt.utils.usb_gpio_driver).
gpio = [
    # USB-to-GPIO converter on x86/non-Pi hosts.
    "pyserial>=3.5",
    # rpi-lgpio is a drop-in for `from RPi import GPIO` that works on Pi 5 (BCM2712);
    # legacy RPi.GPIO fails with "cannot determine peripheral soc base addr" on Pi 5.
    "rpi-lgpio>=0.6; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l' or platform_machine == 'armv6l')",
]
# The scripts under devices/ and examples/ (not part of the installed package).
scripts = ["click>=8.0"]
all = ["dreamscale-i2rt[flow-base,gamepad,viz,gpio,scripts]"]
dev = [
    "dreamscale-i2rt[all]",
    "pyright>=1.1.408",
    "pytest>=8.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.6",
]

[project.urls]
Source = "https://github.com/Dreamscale-Labs/dreamscale-i2rt"
Upstream = "https://github.com/i2rt-robotics/i2rt"

[tool.flit.module]
name = "i2rt"

[tool.ruff]
line-length = 119 # Set the max line length to 119 characters.
lint.select = [
    "ANN", # Annotations.
    "B",   # bugbear rules
    # "D",   # docstring rules.
    "E",   # pycodestyle errors.
    "F",   # Pyflakes rules.
    "I",   # Import sorting.
    "PLC", # Pylint convention warnings.
    "PLE", # Pylint errors.
    "PLR", # Pylint refactor recommendations.
    "PLW", # Pylint warnings.
    "RUF", # Ruff rules.
]
lint.ignore = [
    "ANN204",
    "ANN401",
    "E741",    # Ambiguous variable name. (l, O, or I)
    "F841",
    "E402",
    "E501",
    "PLR1722",
    "PLR2004", # Magic value used in comparison.
    "PLR0915", # Too many statements.
    "PLR0913", # Too many arguments.
    "PLC0414", # Import alias does not rename variable. (this is used for exporting names)
    "PLC0415", # Import not at top level (conditional and __main__ imports are standard).
    "PLC1901", # Use falsey strings.
    "PLR0911", # Too many return statements.
    "PLR0912", # Too many branches.
    "PLW0603", # Global statement updates are discouraged.
    "PLW2901", # For loop variable overwritten.
    "RUF005",
    "RUF009",
    "RUF012",
]
lint.extend-select = ["E501"]
lint.exclude = ["*.ipynb"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["scripts/"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]
omit = ["*exceptions.py"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=8.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.6",
]
